name: Build and Deploy Next.js app
run-name: Deploy ${{ github.event.head_commit.message }}
on:
  push:
    tags:
      - 'v*'
      - 'test*'
      - 'farcaster-test*'
      - 'cherry*'
      # Client-only release: builds and publishes to Cloudflare Pages WITHOUT touching
      # any box. See the deploy-cloudflare job for when to reach for it.
      - 'cloudflareRelease-v*'
  # Manual runs deploy ONLY to Cloudflare: the box job below is skipped for
  # workflow_dispatch. Lets the static build be exercised without shipping to
  # production, which a tag push would do (plan Phase 2 step 9).
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Tag pushes only. A manual run is for validating the Cloudflare build in isolation and
    # must never touch the production box.
    #
    # cloudflareRelease-* is excluded for a sharper reason than "it is a client tag":
    # the `environment:` expression below has no case for that prefix, so it
    # would fall through to its `'test'` default and a client release would
    # silently redeploy the TEST box. Excluding the tag here is what makes the
    # client lane client-only.
    if: >-
      github.event_name != 'workflow_dispatch' &&
      !startsWith(github.ref, 'refs/tags/cloudflareRelease-')
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || startsWith(github.ref, 'refs/tags/cherry') && 'cherry' || startsWith(github.ref, 'refs/tags/test') && 'test' || startsWith(github.ref, 'refs/tags/farcaster-test') && 'test_on_prod' || 'test' }}
    permissions:
      contents: read
      packages: write

    steps:
      # Common setup steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
     
      - name: Set environment specific variables
        id: env_vars
        run: |
          echo "ENV_TAG=latest" >> $GITHUB_ENV
          # ⚠️ ONE IMAGE PER COMMIT, NAMED BY ITS SHA (decided 1 Oct 2026, replacing one tag per
          #    run). Built once; every later tag of the same commit deploys that image.
          #    Consequence, accepted: build-time vars (every NEXT_PUBLIC_*, and
          #    ALLOWED_FRAME_ANCESTORS, which Next bakes into the route headers) are those of the
          #    run that first built the commit. Changing one needs a new commit to take effect.
          echo "SHA_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Docker steps  
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Is this commit's image already built?
        id: image
        run: |
          if docker buildx imagetools inspect "ghcr.io/${REPO_LOWER}:${SHA_TAG}" >/dev/null 2>&1; then
            echo "ghcr.io/${REPO_LOWER}:${SHA_TAG} exists; it will be deployed, not rebuilt."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build step for test and production
      - name: Setup Node.js and build
        if: steps.image.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        if: steps.image.outputs.exists != 'true'
        env:
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          RPC_URL: ${{ vars.RPC_URL }}
          SUPPORTED_TOKENS: ${{ vars.SUPPORTED_TOKENS }}
          USDC_CONTRACT_ADDRESS: ${{ vars.USDC_CONTRACT_ADDRESS }}
          USDT_CONTRACT_ADDRESS: ${{ vars.USDT_CONTRACT_ADDRESS }}
          DEFAULT_TOKEN_SYMBOL: ${{ vars.DEFAULT_TOKEN_SYMBOL }}
          USER_SERVICE_URL: ${{ vars.USER_SERVICE_URL }}
          CHAIN_SERVICE_URL: ${{ vars.CHAIN_SERVICE_URL }}
          CONTRACT_SERVICE_URL: ${{ vars.CONTRACT_SERVICE_URL }}
          MOONPAY_API_KEY: ${{ secrets.MOONPAY_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          MIN_GAS_WEI: ${{ vars.MIN_GAS_WEI }}
          MAX_GAS_PRICE_GWEI: ${{ vars.MAX_GAS_PRICE_GWEI }}
          MAX_GAS_COST_GWEI: ${{ vars.MAX_GAS_COST_GWEI }}
          USDC_GRANT_FOUNDRY_GAS: ${{ vars.USDC_GRANT_FOUNDRY_GAS }}
          DEPOSIT_FUNDS_FOUNDRY_GAS: ${{ vars.DEPOSIT_FUNDS_FOUNDRY_GAS }}
          RESOLUTION_VOTE_FOUNDRY_GAS: ${{ vars.RESOLUTION_VOTE_FOUNDRY_GAS }}
          RAISE_DISPUTE_FOUNDRY_GAS: ${{ vars.RAISE_DISPUTE_FOUNDRY_GAS }}
          CLAIM_FUNDS_FOUNDRY_GAS: ${{ vars.CLAIM_FUNDS_FOUNDRY_GAS }}
          GAS_PRICE_BUFFER: ${{ vars.GAS_PRICE_BUFFER }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_API_URL: ${{ vars.NEYNAR_API_URL }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          GIT_TAG: ${{ env.GIT_TAG }}
          GIT_SHA: ${{ env.GIT_SHA }}
          # Same values again as NEXT_PUBLIC_*, so the bundle can report its own
          # version rather than only the API's. Next inlines NEXT_PUBLIC_* at
          # build time; GIT_TAG/GIT_SHA above stay server-side for /api/config.
          # The trust anchor for escrow verification. MUST be build-time
          # (NEXT_PUBLIC_*, inlined into the bundle) and MUST NOT be served from
          # /api/config: if the same API that supplies a clone address also
          # supplied the implementation to check it against, a compromised API
          # would return a matching pair and the check would compare its own
          # answer to itself. See lib/escrow/verifyEscrowClone.ts.
          NEXT_PUBLIC_ESCROW_IMPLEMENTATION_ADDRESS: ${{ vars.ESCROW_IMPLEMENTATION_ADDRESS }}
          # The RPC escrow verification reads through. MUST be build-time: the
          # app's own RPC endpoint comes from /api/config, so a compromised API
          # could point verification at a node it controls and have it confirm
          # whatever it liked. See lib/escrow/verificationRpc.ts.
          NEXT_PUBLIC_RPC_URL: ${{ vars.RPC_URL }}
          NEXT_PUBLIC_GIT_TAG: ${{ env.GIT_TAG }}
          NEXT_PUBLIC_GIT_SHA: ${{ env.GIT_SHA }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
          SERVICE_LINK: ${{ vars.SERVICE_LINK }}
          ALLOWED_FRAME_ANCESTORS: ${{ vars.ALLOWED_FRAME_ANCESTORS }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_NAME: ${{ vars.SHOPIFY_NAME }}
          SHOPIFY_SCOPES: ${{ vars.SHOPIFY_SCOPES }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REDDIT_PIXEL_ID: ${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}
          NEXT_PUBLIC_EXCHANGE_RATE_API_URL: ${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}
          # Mobile debug logging. Next inlines NEXT_PUBLIC_* at build time, so
          # this has to be present HERE - setting it on the running container
          # does nothing. Unset resolves to '' which is not 'true', so the
          # pipeline stays off unless a repo/environment variable turns it on.
          NEXT_PUBLIC_MOBILE_DEBUG_LOGGING: ${{ vars.NEXT_PUBLIC_MOBILE_DEBUG_LOGGING }}
          # Set to 'false' to disable SIWX for embedded email/social wallets too.
          NEXT_PUBLIC_EMBEDDED_SIWX: ${{ vars.NEXT_PUBLIC_EMBEDDED_SIWX }}
          COINBASE_PROJECT_ID: ${{ vars.COINBASE_PROJECT_ID }}
          COINBASE_API_KEY_ID: ${{ secrets.COINBASE_API_KEY_ID }}
          COINBASE_API_KEY_SECRET: ${{ secrets.COINBASE_API_KEY_SECRET }}
        run: scripts/build-server-bundle.sh

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_on: error
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file Dockerfile \
              --push \
              --tag ghcr.io/${{ env.REPO_LOWER }}:${{ env.SHA_TAG }} \
              .

      # Deploy step
      - name: Deploy to GCP
        run: |
          set -o pipefail

          # The key is held in an agent, never written to disk. `ssh -i` takes a
          # path and has no way to accept a key as a string, so the choice is a
          # file or an agent — and a file left in ~/.ssh stays readable by every
          # later step in the job, including any third-party action.
          # printf, not echo: ssh-add rejects a key without a trailing newline.
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null 2>&1 || true' EXIT
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | ssh-add - 2>/dev/null \
            || { echo "Could not load SSH_PRIVATE_KEY into the agent" >&2; exit 1; }

          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.VM_IP }} >> ~/.ssh/known_hosts

          SSH="ssh -o BatchMode=yes -o ServerAliveInterval=15 -l gituser ${{ vars.VM_IP }}"
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}:${{ env.SHA_TAG }}"

          # Run a command up to N times with linear backoff.
          retry() {
            attempts=$1; shift
            n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "FAILED after $n attempts: $*" >&2
                return 1
              fi
              echo "Attempt $n failed; retrying in $((n * 10))s: $*" >&2
              sleep $((n * 10))
              n=$((n + 1))
            done
          }

          # ---------------------------------------------------------------
          # Ship the image over SSH instead of having the box pull it.
          #
          # The production box's egress IP is intermittently refused by
          # GitHub's edge: measured at 5 failures in 20 TLS handshakes to
          # ghcr.io, while Google, Cloudflare and Docker Hub were 0 in 20 from
          # the same host at the same time. DNS and local networking are clean,
          # so there is nothing to fix on the box — the deploy simply cannot
          # rely on it reaching ghcr.io. The runner's GitHub connectivity is
          # fine and SSH to the box is reliable, so we push the bytes down the
          # connection that works.
          # ---------------------------------------------------------------

          # The image is multi-platform, so save the one the box can actually
          # run rather than whichever the runner happens to be.
          REMOTE_ARCH=$($SSH 'dpkg --print-architecture 2>/dev/null || uname -m')
          case "$REMOTE_ARCH" in
            amd64|x86_64)  PLATFORM=linux/amd64 ;;
            arm64|aarch64) PLATFORM=linux/arm64 ;;
            *) echo "Unsupported remote architecture: $REMOTE_ARCH" >&2; exit 1 ;;
          esac
          echo "Remote architecture: $REMOTE_ARCH -> $PLATFORM"

          # buildx --push uploads straight to the registry without leaving the
          # image in the runner's local store, so fetch it back before saving.
          retry 5 docker pull --platform "$PLATFORM" "$IMAGE"

          ship_image() {
            docker save "$IMAGE" | gzip -1 | $SSH 'gunzip | docker load'
          }

          if $SSH "docker image inspect '$IMAGE' >/dev/null 2>&1"; then
            echo "Box already has $IMAGE; skipping transfer."
          else
            retry 3 ship_image
          fi

          # Prove the image is on the box BEFORE the deploy script stops the
          # running container. Without this a failed transfer would take the
          # site down and leave nothing to start again.
          $SSH "docker image inspect '$IMAGE' >/dev/null" \
            || { echo "Image missing on the box after transfer" >&2; exit 1; }

          # Create deployment script with all values populated
          cat > /tmp/deploy_script.sh << EOF
          set -e
          docker stop ${{ vars.SERVICE_NAME }} || true
          docker rm ${{ vars.SERVICE_NAME }} || true
          docker run -d \\
            --name ${{ vars.SERVICE_NAME }} \\
            --network ${{ vars.DOCKER_NETWORK }} \\
            --restart unless-stopped \\
            --memory=256m \\
            -e NODE_OPTIONS="--max-old-space-size=192" \\
            -e CHAIN_ID="${{ vars.CHAIN_ID }}" \\
            -e RPC_URL="${{ vars.RPC_URL }}" \\
            -e CHAIN_SERVICE_URL="${{ vars.CHAIN_SERVICE_URL }}" \\
            -e USER_SERVICE_URL="${{ vars.USER_SERVICE_URL }}" \\
            -e CONTRACT_SERVICE_URL="${{ vars.CONTRACT_SERVICE_URL }}" \\
            -e AP2_SERVICE_URL="${{ vars.AP2_SERVICE_URL }}" \\
            -e DISPUTE_SERVICE_URL="${{ vars.DISPUTE_SERVICE_URL }}" \\
            -e WHITELABEL_SERVICE_URL="${{ vars.WHITELABEL_SERVICE_URL }}" \\
            -e MOONPAY_API_KEY="${{ secrets.MOONPAY_API_KEY }}" \\
            -e X_API_KEY="${{ secrets.X_API_KEY }}" \\
            -e EMAIL_SERVICE_URL="${{ vars.EMAIL_SERVICE_URL }}" \\
            -e TO_EMAILSERVICE_API_KEY="${{ secrets.TO_EMAILSERVICE_API_KEY }}" \\
            -e GIT_TAG="${{ env.GIT_TAG }}" \\
            -e GIT_SHA="${{ env.GIT_SHA }}" \\
            -e COOKIE_DOMAIN="${{ vars.COOKIE_DOMAIN }}" \\
            -e BUILD_VERSION="${{ env.BUILD_VERSION }}" \\
            -e SUPPORTED_TOKENS='${{ vars.SUPPORTED_TOKENS }}' \\
            -e USDC_CONTRACT_ADDRESS="${{ vars.USDC_CONTRACT_ADDRESS }}" \\
            -e USDT_CONTRACT_ADDRESS="${{ vars.USDT_CONTRACT_ADDRESS }}" \\
            -e DEFAULT_TOKEN_SYMBOL="${{ vars.DEFAULT_TOKEN_SYMBOL }}" \\
            -e MIN_GAS_WEI="${{ vars.MIN_GAS_WEI }}" \\
            -e MAX_GAS_PRICE_GWEI="${{ vars.MAX_GAS_PRICE_GWEI }}" \\
            -e MAX_GAS_COST_GWEI="${{ vars.MAX_GAS_COST_GWEI }}" \\
            -e USDC_GRANT_FOUNDRY_GAS="${{ vars.USDC_GRANT_FOUNDRY_GAS }}" \\
            -e DEPOSIT_FUNDS_FOUNDRY_GAS="${{ vars.DEPOSIT_FUNDS_FOUNDRY_GAS }}" \\
            -e RESOLUTION_VOTE_FOUNDRY_GAS="${{ vars.RESOLUTION_VOTE_FOUNDRY_GAS }}" \\
            -e RAISE_DISPUTE_FOUNDRY_GAS="${{ vars.RAISE_DISPUTE_FOUNDRY_GAS }}" \\
            -e CLAIM_FUNDS_FOUNDRY_GAS="${{ vars.CLAIM_FUNDS_FOUNDRY_GAS }}" \\
            -e GAS_PRICE_BUFFER="${{ vars.GAS_PRICE_BUFFER }}" \\
            -e NEXT_PUBLIC_BASE_PATH="${{ vars.NEXT_PUBLIC_BASE_PATH }}" \\
            -e EXPLORER_BASE_URL="${{ vars.EXPLORER_BASE_URL }}" \\
            -e PRODUCT_NAME="${{ vars.PRODUCT_NAME }}" \\
            -e SERVICE_LINK="${{ vars.SERVICE_LINK }}" \\
            -e NEYNAR_API_KEY="${{ secrets.NEYNAR_API_KEY }}" \\
            -e NEYNAR_API_URL="${{ vars.NEYNAR_API_URL }}" \\
            -e WALLETCONNECT_PROJECT_ID="${{ secrets.WALLETCONNECT_PROJECT_ID }}" \\
            -e PRIVY_APP_ID="${{ vars.PRIVY_APP_ID }}" \\
            -e ALLOWED_FRAME_ANCESTORS="${{ vars.ALLOWED_FRAME_ANCESTORS }}" \\
            -e PROJECTS_LIVE="${{ vars.PROJECTS_LIVE }}" \\
            -e EMAIL_VERIFICATION_LIVE="${{ vars.EMAIL_VERIFICATION_LIVE }}" \\
            -e SHOPIFY_CLIENT_ID="${{ secrets.SHOPIFY_CLIENT_ID }}" \\
            -e SHOPIFY_CLIENT_SECRET="${{ secrets.SHOPIFY_CLIENT_SECRET }}" \\
            -e SHOPIFY_NAME="${{ vars.SHOPIFY_NAME }}" \\
            -e SHOPIFY_SCOPES="${{ vars.SHOPIFY_SCOPES }}" \\
            -e SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \\
            -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \\
            -e NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \\
            -e NEXT_PUBLIC_REDDIT_PIXEL_ID="${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}" \\
            -e NEXT_PUBLIC_EXCHANGE_RATE_API_URL="${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}" \\
            -e COINBASE_PROJECT_ID="${{ vars.COINBASE_PROJECT_ID }}" \\
            -e COINBASE_API_KEY_ID="${{ secrets.COINBASE_API_KEY_ID }}" \\
            -e COINBASE_API_KEY_SECRET="${{ secrets.COINBASE_API_KEY_SECRET }}" \\
            ghcr.io/${{ env.REPO_LOWER }}:${{ env.SHA_TAG }}
          # Loaded images accumulate now that nothing is pulling and pruning
          # implicitly; drop only untagged layers, never a tagged image.
          docker image prune -f
          EOF

          # Copy script to remote tmpfs and execute
          retry 3 scp -o BatchMode=yes /tmp/deploy_script.sh gituser@${{ vars.VM_IP }}:/dev/shm/deploy_script.sh
          $SSH "chmod +x /dev/shm/deploy_script.sh && /dev/shm/deploy_script.sh && rm /dev/shm/deploy_script.sh"


      # ── The static site, built once per commit for the Cloudflare release ────────────
      #
      # The cherry release builds stabledrop.me's static export and stores it as an image named
      # by the commit SHA (scripts/static-site-image.sh). A cloudflareRelease-* tag on the same
      # commit then deploys that instead of building again. When the Cloudflare release comes
      # first it stores the static site itself, and this finds it and builds nothing.
      #
      # ⚠️ AFTER THE BOX DEPLOY, AND NEVER ITS FAILURE. It does not delay webapp-prod, and if it
      #    cannot build (settings missing on this environment, a flaky npm) the release stays
      #    green: the Cloudflare release simply builds for itself, as it always did.
      #
      # ⚠️ ITS SETTINGS COME FROM THIS (cherry) ENVIRONMENT, not github-pages: a job reads only
      #    its own environment's vars. NEXT_PUBLIC_API_BASE_URL and PAGES_BASE_PATH must be set
      #    here too, with the github-pages values, or this step skips.
      - name: Is this commit's static site already built?
        id: static_site
        if: startsWith(github.ref, 'refs/tags/cherry')
        continue-on-error: true
        run: |
          if scripts/static-site-image.sh exists; then
            echo "This commit's static site is already stored; nothing to build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node for the static site
        if: startsWith(github.ref, 'refs/tags/cherry') && steps.static_site.outputs.exists == 'false'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and store the static site for Cloudflare
        if: startsWith(github.ref, 'refs/tags/cherry') && steps.static_site.outputs.exists == 'false'
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REDDIT_PIXEL_ID: ${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}
          NEXT_PUBLIC_EXCHANGE_RATE_API_URL: ${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}
          NEXT_PUBLIC_MOBILE_DEBUG_LOGGING: ${{ vars.NEXT_PUBLIC_MOBILE_DEBUG_LOGGING }}
          NEXT_PUBLIC_EMBEDDED_SIWX: ${{ vars.NEXT_PUBLIC_EMBEDDED_SIWX }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.RPC_URL }}
          NEXT_PUBLIC_ESCROW_IMPLEMENTATION_ADDRESS: ${{ vars.ESCROW_IMPLEMENTATION_ADDRESS }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "::warning::NEXT_PUBLIC_API_BASE_URL is not set on the cherry environment, so the static site was not built here. The Cloudflare release will build it itself."
            exit 0
          fi
          scripts/build-static-export.sh
          scripts/static-site-image.sh push

  # ---------------------------------------------------------------------------
  # The server image, built by a Cloudflare release when its commit has none yet.
  #
  # Either release can come first. When cherry-v* comes first it builds the server image and also
  # stores the static site; this job is the other way round: when cloudflareRelease-* comes first,
  # it builds the server image a later cherry release of the same commit then deploys without
  # building. It deploys nothing.
  #
  # ⚠️ UNDER THE cherry ENVIRONMENT, IN ITS OWN JOB. The server build needs the box's settings and
  #    secrets (MONGODB_URI, SESSION_SECRET, the Coinbase keys…). They stay on cherry: the
  #    Cloudflare job's environment holds public values only, because its output is world-readable.
  #
  # ⚠️ NEVER THE CLOUDFLARE RELEASE'S FAILURE: no `needs`, and continue-on-error. If it cannot
  #    build, the cherry release builds for itself, as it always did.
  # ---------------------------------------------------------------------------
  build-server-image:
    if: startsWith(github.ref, 'refs/tags/cloudflareRelease-')
    runs-on: ubuntu-latest
    environment: cherry
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Name this commit's server image
        run: |
          echo "SHA_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Is this commit's image already built?
        id: image
        run: |
          if docker buildx imagetools inspect "ghcr.io/${REPO_LOWER}:${SHA_TAG}" >/dev/null 2>&1; then
            echo "ghcr.io/${REPO_LOWER}:${SHA_TAG} exists; nothing to build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.image.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The same settings the box release builds with (see build-and-deploy's "Install and build").
      - name: Build the server
        if: steps.image.outputs.exists != 'true'
        env:
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          RPC_URL: ${{ vars.RPC_URL }}
          SUPPORTED_TOKENS: ${{ vars.SUPPORTED_TOKENS }}
          USDC_CONTRACT_ADDRESS: ${{ vars.USDC_CONTRACT_ADDRESS }}
          USDT_CONTRACT_ADDRESS: ${{ vars.USDT_CONTRACT_ADDRESS }}
          DEFAULT_TOKEN_SYMBOL: ${{ vars.DEFAULT_TOKEN_SYMBOL }}
          USER_SERVICE_URL: ${{ vars.USER_SERVICE_URL }}
          CHAIN_SERVICE_URL: ${{ vars.CHAIN_SERVICE_URL }}
          CONTRACT_SERVICE_URL: ${{ vars.CONTRACT_SERVICE_URL }}
          MOONPAY_API_KEY: ${{ secrets.MOONPAY_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          MIN_GAS_WEI: ${{ vars.MIN_GAS_WEI }}
          MAX_GAS_PRICE_GWEI: ${{ vars.MAX_GAS_PRICE_GWEI }}
          MAX_GAS_COST_GWEI: ${{ vars.MAX_GAS_COST_GWEI }}
          USDC_GRANT_FOUNDRY_GAS: ${{ vars.USDC_GRANT_FOUNDRY_GAS }}
          DEPOSIT_FUNDS_FOUNDRY_GAS: ${{ vars.DEPOSIT_FUNDS_FOUNDRY_GAS }}
          RESOLUTION_VOTE_FOUNDRY_GAS: ${{ vars.RESOLUTION_VOTE_FOUNDRY_GAS }}
          RAISE_DISPUTE_FOUNDRY_GAS: ${{ vars.RAISE_DISPUTE_FOUNDRY_GAS }}
          CLAIM_FUNDS_FOUNDRY_GAS: ${{ vars.CLAIM_FUNDS_FOUNDRY_GAS }}
          GAS_PRICE_BUFFER: ${{ vars.GAS_PRICE_BUFFER }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_API_URL: ${{ vars.NEYNAR_API_URL }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          GIT_TAG: ${{ env.GIT_TAG }}
          GIT_SHA: ${{ env.GIT_SHA }}
          # Same values again as NEXT_PUBLIC_*, so the bundle can report its own
          # version rather than only the API's. Next inlines NEXT_PUBLIC_* at
          # build time; GIT_TAG/GIT_SHA above stay server-side for /api/config.
          # The trust anchor for escrow verification. MUST be build-time
          # (NEXT_PUBLIC_*, inlined into the bundle) and MUST NOT be served from
          # /api/config: if the same API that supplies a clone address also
          # supplied the implementation to check it against, a compromised API
          # would return a matching pair and the check would compare its own
          # answer to itself. See lib/escrow/verifyEscrowClone.ts.
          NEXT_PUBLIC_ESCROW_IMPLEMENTATION_ADDRESS: ${{ vars.ESCROW_IMPLEMENTATION_ADDRESS }}
          # The RPC escrow verification reads through. MUST be build-time: the
          # app's own RPC endpoint comes from /api/config, so a compromised API
          # could point verification at a node it controls and have it confirm
          # whatever it liked. See lib/escrow/verificationRpc.ts.
          NEXT_PUBLIC_RPC_URL: ${{ vars.RPC_URL }}
          NEXT_PUBLIC_GIT_TAG: ${{ env.GIT_TAG }}
          NEXT_PUBLIC_GIT_SHA: ${{ env.GIT_SHA }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
          SERVICE_LINK: ${{ vars.SERVICE_LINK }}
          ALLOWED_FRAME_ANCESTORS: ${{ vars.ALLOWED_FRAME_ANCESTORS }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_NAME: ${{ vars.SHOPIFY_NAME }}
          SHOPIFY_SCOPES: ${{ vars.SHOPIFY_SCOPES }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REDDIT_PIXEL_ID: ${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}
          NEXT_PUBLIC_EXCHANGE_RATE_API_URL: ${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}
          # Mobile debug logging. Next inlines NEXT_PUBLIC_* at build time, so
          # this has to be present HERE - setting it on the running container
          # does nothing. Unset resolves to '' which is not 'true', so the
          # pipeline stays off unless a repo/environment variable turns it on.
          NEXT_PUBLIC_MOBILE_DEBUG_LOGGING: ${{ vars.NEXT_PUBLIC_MOBILE_DEBUG_LOGGING }}
          # Set to 'false' to disable SIWX for embedded email/social wallets too.
          NEXT_PUBLIC_EMBEDDED_SIWX: ${{ vars.NEXT_PUBLIC_EMBEDDED_SIWX }}
          COINBASE_PROJECT_ID: ${{ vars.COINBASE_PROJECT_ID }}
          COINBASE_API_KEY_ID: ${{ secrets.COINBASE_API_KEY_ID }}
          COINBASE_API_KEY_SECRET: ${{ secrets.COINBASE_API_KEY_SECRET }}
        run: scripts/build-server-bundle.sh

      - name: Build and push the server image
        if: steps.image.outputs.exists != 'true'
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_on: error
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file Dockerfile \
              --push \
              --tag ghcr.io/${{ env.REPO_LOWER }}:${{ env.SHA_TAG }} \
              .

  # ---------------------------------------------------------------------------
  # Cloudflare Pages deploy — the client release, on its own tag. Publishes the
  # static export to stabledrop.me. (It started life as a GitHub Pages deploy,
  # STATIC_FRONTEND_MIGRATION_PLAN.md Phase 2 step 8; that host is retired.)
  #
  # No `needs:` on build-and-deploy, and none is possible: the two jobs no longer
  # share a trigger, so on any given run exactly one of them is live. Ordering
  # between a client and an API release is now the tagger's, not the workflow's —
  # see the `if:` below.
  #
  # The `github-pages` environment is what gates this on manual approval — add a
  # required reviewer to it in Settings > Environments. Required reviewers work
  # here because this repo is public; they are unavailable on private repos under
  # the Team plan.
  # ---------------------------------------------------------------------------
  deploy-cloudflare:
    # cloudflareRelease-v* only (plus manual runs). The client and the box are now
    # separate releases: cloudflareRelease-v* publishes to Cloudflare and touches no box,
    # cherry-v* deploys webapp-prod and publishes nothing.
    #
    # The client deliberately does NOT ride cherry-v* any more. What it must not ride
    # is test*/farcaster-test*, which deploy webapp-test: publishing the client
    # on those would push it ahead of the webapp-prod API that api.stabledrop.me
    # actually proxies. That is the drift the Client/API version rows expose, and
    # a dedicated client tag cannot cause it — this job simply never runs on a
    # box tag.
    #
    # The discipline this hands back to the release, since one tag no longer
    # moves both: a change spanning client and API is TWO tags, API first.
    # Tag cherry-v* and let webapp-prod come up serving the new endpoint, then
    # tag cloudflareRelease-v* to publish the client that calls it. Reversing the
    # order puts a bundle on Cloudflare calling something that 404s until the box
    # deploy lands. A client-only change (copy, styling, a fix inside the
    # bundle) is just the one cloudflareRelease-v* tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/cloudflareRelease-')
    runs-on: ubuntu-latest
    environment:
      # Named for the old host. Every NEXT_PUBLIC_* var and the Cloudflare secrets below
      # resolve against THIS environment, and its approval gate is what guards a release,
      # so the name stays. Renaming means moving all of them.
      name: github-pages
      url: https://stabledrop.me
    permissions:
      contents: read
      # Reads this commit's stored static site; stores it when it has to build it itself.
      packages: write
    # One deployment at a time; never cancel a run that is mid-publish.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── The static site: the one the cherry release stored, or built here ─────────────
      #
      # The cherry release builds out/ once per commit and stores it as an image named by the
      # SHA. Found, it is deployed as it is: no npm ci, no build. Not found (no cherry release on
      # this commit yet), it is built here and stored, so the next release of this commit
      # reuses it. The build itself is scripts/build-static-export.sh, shared with cherry.
      - name: Name this commit's static site
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "SHA_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Is this commit's static site already built?
        id: static_site
        run: |
          if scripts/static-site-image.sh exists; then
            echo "Stored by an earlier release of this commit; it will be deployed, not rebuilt."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use the stored static site
        if: steps.static_site.outputs.exists == 'true'
        run: scripts/static-site-image.sh pull

      - uses: actions/setup-node@v4
        if: steps.static_site.outputs.exists != 'true'
        with:
          node-version: '20'

      # Only NEXT_PUBLIC_* values: the output is world-readable static files. NEVER return anything
      # from getStaticProps that is not already public (see the comments in the build script).
      - name: Build static export
        if: steps.static_site.outputs.exists != 'true'
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REDDIT_PIXEL_ID: ${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}
          NEXT_PUBLIC_EXCHANGE_RATE_API_URL: ${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}
          NEXT_PUBLIC_MOBILE_DEBUG_LOGGING: ${{ vars.NEXT_PUBLIC_MOBILE_DEBUG_LOGGING }}
          NEXT_PUBLIC_EMBEDDED_SIWX: ${{ vars.NEXT_PUBLIC_EMBEDDED_SIWX }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.RPC_URL }}
          NEXT_PUBLIC_ESCROW_IMPLEMENTATION_ADDRESS: ${{ vars.ESCROW_IMPLEMENTATION_ADDRESS }}
        run: |
          set -euo pipefail
          scripts/build-static-export.sh
          scripts/static-site-image.sh push

      # ── Cloudflare Pages: the live site ──────────────────────────────────────────────
      #
      # The only host. GitHub Pages was retired after Cloudflare took over stabledrop.me.
      # Without the project name the release would build and then publish nowhere while
      # looking finished, so a missing setting fails the run here instead.
      - name: Check the Cloudflare project is configured
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "${CLOUDFLARE_PAGES_PROJECT}" ]; then
            echo "CLOUDFLARE_PAGES_PROJECT is not set on the github-pages environment; nothing would be published." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned so a deploy cannot change underneath a release. The action otherwise
          # resolves its own version at run time, which is how the same tag can behave
          # differently a week apart.
          wranglerVersion: '3.90.0'
          # --branch decides production vs preview, and it is NOT the git ref.
          # This job runs on a cloudflareRelease-v* TAG, so letting wrangler infer the
          # branch would publish every release as a preview on a URL nobody
          # visits, leaving the live site on the previous build with the run
          # still green. It must name the project's production branch.
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
