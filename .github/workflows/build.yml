name: Build and Deploy Next.js app
run-name: Deploy ${{ github.event.head_commit.message }}
on:
  push:
    tags:
      - 'v*'
      - 'test*'
      - 'cherry*'
      # Client-only release: publishes the static site the cherry release of the same
      # commit built, WITHOUT building anything or touching any box. See deploy-cloudflare.
      - 'cloudflareRelease-v*'
  # Manual runs deploy ONLY to Cloudflare: the box job below is skipped for
  # workflow_dispatch. Like a cloudflareRelease tag, it publishes the static site
  # cherry built for the commit, and fails if there is none.
  workflow_dispatch:

jobs:
  build:
    # Tag pushes only. A manual run is for validating the Cloudflare build in isolation and
    # must never touch the production box.
    #
    # cloudflareRelease-* is excluded for a sharper reason than "it is a client tag":
    # the `environment:` expression below has no case for that prefix, so it
    # would fall through to its `'test'` default and a client release would
    # silently redeploy the TEST box. Excluding the tag here is what makes the
    # client lane client-only.
    if: >-
      github.event_name != 'workflow_dispatch' &&
      !startsWith(github.ref, 'refs/tags/cloudflareRelease-')
    runs-on: ubuntu-latest
    # The build stays in the environment: Next bakes the environment's settings (and reads some of
    # its secrets) at build time, so each environment builds its own image.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || startsWith(github.ref, 'refs/tags/cherry') && 'cherry' || 'test' }}
    outputs:
      image: ${{ steps.env_vars.outputs.image }}
      git_tag: ${{ steps.env_vars.outputs.git_tag }}
      git_sha: ${{ steps.env_vars.outputs.git_sha }}
    permissions:
      contents: read
      packages: write

    steps:
      # Common setup steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
     
      - name: Set environment specific variables
        id: env_vars
        env:
          # The same mapping as `environment:` above; a step cannot read the job's environment name.
          ENV_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || startsWith(github.ref, 'refs/tags/cherry') && 'cherry' || 'test' }}
        run: |
          echo "ENV_TAG=latest" >> $GITHUB_ENV
          # ⚠️ ONE IMAGE PER COMMIT PER ENVIRONMENT, named <environment>-<sha> (cherry-1a2b3c4d,
          #    test-1a2b3c4d). Next bakes every NEXT_PUBLIC_* (and ALLOWED_FRAME_ANCESTORS, in the
          #    route headers) in at BUILD time, so an image is only right for the environment
          #    that built it. Plain-SHA tags let a test release and a cherry release of the same
          #    commit share one image, and cherry could deploy test's build.
          #    A re-run of the same environment on the same commit deploys the image it built.
          echo "IMAGE_TAG=${ENV_NAME}-${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          REPO_LOWER=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$REPO_LOWER:${ENV_NAME}-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "git_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Docker steps  
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Is this commit's image already built?
        id: image
        run: |
          if docker buildx imagetools inspect "ghcr.io/${REPO_LOWER}:${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "ghcr.io/${REPO_LOWER}:${IMAGE_TAG} exists; it will be deployed, not rebuilt."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Build step for test and production
      - name: Setup Node.js and build
        if: steps.image.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install and build
        if: steps.image.outputs.exists != 'true'
        env:
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          RPC_URL: ${{ vars.RPC_URL }}
          SUPPORTED_TOKENS: ${{ vars.SUPPORTED_TOKENS }}
          USDC_CONTRACT_ADDRESS: ${{ vars.USDC_CONTRACT_ADDRESS }}
          USDT_CONTRACT_ADDRESS: ${{ vars.USDT_CONTRACT_ADDRESS }}
          DEFAULT_TOKEN_SYMBOL: ${{ vars.DEFAULT_TOKEN_SYMBOL }}
          USER_SERVICE_URL: ${{ vars.USER_SERVICE_URL }}
          CHAIN_SERVICE_URL: ${{ vars.CHAIN_SERVICE_URL }}
          CONTRACT_SERVICE_URL: ${{ vars.CONTRACT_SERVICE_URL }}
          MOONPAY_API_KEY: ${{ secrets.MOONPAY_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          MIN_GAS_WEI: ${{ vars.MIN_GAS_WEI }}
          MAX_GAS_PRICE_GWEI: ${{ vars.MAX_GAS_PRICE_GWEI }}
          MAX_GAS_COST_GWEI: ${{ vars.MAX_GAS_COST_GWEI }}
          USDC_GRANT_FOUNDRY_GAS: ${{ vars.USDC_GRANT_FOUNDRY_GAS }}
          RESOLUTION_VOTE_FOUNDRY_GAS: ${{ vars.RESOLUTION_VOTE_FOUNDRY_GAS }}
          RAISE_DISPUTE_FOUNDRY_GAS: ${{ vars.RAISE_DISPUTE_FOUNDRY_GAS }}
          CLAIM_FUNDS_FOUNDRY_GAS: ${{ vars.CLAIM_FUNDS_FOUNDRY_GAS }}
          GAS_PRICE_BUFFER: ${{ vars.GAS_PRICE_BUFFER }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_API_URL: ${{ vars.NEYNAR_API_URL }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          PRIVY_APP_ID: ${{ vars.PRIVY_APP_ID }}
          SHOW_LEGACY_AUTH: ${{ vars.SHOW_LEGACY_AUTH }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          GIT_TAG: ${{ env.GIT_TAG }}
          GIT_SHA: ${{ env.GIT_SHA }}
          # Same values again as NEXT_PUBLIC_*, so the bundle can report its own
          # version rather than only the API's. Next inlines NEXT_PUBLIC_* at
          # build time; GIT_TAG/GIT_SHA above stay server-side for /api/config.
          # The trust anchor for escrow verification. MUST be build-time
          # (NEXT_PUBLIC_*, inlined into the bundle) and MUST NOT be served from
          # /api/config: if the same API that supplies a clone address also
          # supplied the implementation to check it against, a compromised API
          # would return a matching pair and the check would compare its own
          # answer to itself. See lib/escrow/verifyEscrowClone.ts.
          NEXT_PUBLIC_ESCROW_IMPLEMENTATION_ADDRESS: ${{ vars.ESCROW_IMPLEMENTATION_ADDRESS }}
          # The factory a genuine escrow must have been created by, for the same reason and with
          # the same rule: build-time only, never from /api/config. A clone of our implementation
          # made by anyone else's factory carries whatever partner and fee that factory chose.
          # See lib/escrow/verifyEscrowFactory.ts.
          NEXT_PUBLIC_ESCROW_FACTORY_ADDRESS: ${{ vars.CONTRACT_FACTORY_ADDRESS }}
          # The RPC escrow verification reads through. MUST be build-time: the
          # app's own RPC endpoint comes from /api/config, so a compromised API
          # could point verification at a node it controls and have it confirm
          # whatever it liked. See lib/escrow/verificationRpc.ts.
          NEXT_PUBLIC_RPC_URL: ${{ vars.RPC_URL }}
          NEXT_PUBLIC_GIT_TAG: ${{ env.GIT_TAG }}
          NEXT_PUBLIC_GIT_SHA: ${{ env.GIT_SHA }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
          SERVICE_LINK: ${{ vars.SERVICE_LINK }}
          ALLOWED_FRAME_ANCESTORS: ${{ vars.ALLOWED_FRAME_ANCESTORS }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_NAME: ${{ vars.SHOPIFY_NAME }}
          SHOPIFY_SCOPES: ${{ vars.SHOPIFY_SCOPES }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REDDIT_PIXEL_ID: ${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_EXCHANGE_RATE_API_URL: ${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}
          # Mobile debug logging. Next inlines NEXT_PUBLIC_* at build time, so
          # this has to be present HERE - setting it on the running container
          # does nothing. Unset resolves to '' which is not 'true', so the
          # pipeline stays off unless a repo/environment variable turns it on.
          NEXT_PUBLIC_MOBILE_DEBUG_LOGGING: ${{ vars.NEXT_PUBLIC_MOBILE_DEBUG_LOGGING }}
          # Set to 'false' to disable SIWX for embedded email/social wallets too.
          NEXT_PUBLIC_EMBEDDED_SIWX: ${{ vars.NEXT_PUBLIC_EMBEDDED_SIWX }}
          COINBASE_PROJECT_ID: ${{ vars.COINBASE_PROJECT_ID }}
          COINBASE_API_KEY_ID: ${{ secrets.COINBASE_API_KEY_ID }}
          COINBASE_API_KEY_SECRET: ${{ secrets.COINBASE_API_KEY_SECRET }}
        run: scripts/build-server-bundle.sh

      - name: Build and push image
        if: steps.image.outputs.exists != 'true'
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_on: error
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file Dockerfile \
              --push \
              --tag ghcr.io/${{ env.REPO_LOWER }}:${{ env.IMAGE_TAG }} \
              .

      # ── The static site for Cloudflare: cherry builds it, the Cloudflare release only publishes it ──
      #
      # Stored as ghcr.io/<repo>-static:cherry-<sha> (scripts/static-site-image.sh). A
      # cloudflareRelease-* tag on the same commit deploys exactly that and builds nothing.
      #
      # ⚠️ BEFORE THE BOX DEPLOY, AND IT FAILS THE RELEASE. It is the only way a client reaches
      #    Cloudflare now, so a cherry release that could not make one must say so — before it
      #    has changed webapp-prod, not after.
      #
      # ⚠️ ITS SETTINGS ARE THIS (cherry) ENVIRONMENT'S, not github-pages': a job reads only its own
      #    environment's vars. NEXT_PUBLIC_API_BASE_URL and PAGES_BASE_PATH are repository-level,
      #    so both environments see the same ones.
      - name: Is this commit's static site already built?
        id: static_site
        if: startsWith(github.ref, 'refs/tags/cherry')
        run: |
          if scripts/static-site-image.sh exists; then
            echo "This commit's static site is already stored; nothing to build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node for the static site
        if: startsWith(github.ref, 'refs/tags/cherry') && steps.static_site.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Build and store the static site for Cloudflare
        if: startsWith(github.ref, 'refs/tags/cherry') && steps.static_site.outputs.exists == 'false'
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REDDIT_PIXEL_ID: ${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_EXCHANGE_RATE_API_URL: ${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}
          NEXT_PUBLIC_MOBILE_DEBUG_LOGGING: ${{ vars.NEXT_PUBLIC_MOBILE_DEBUG_LOGGING }}
          NEXT_PUBLIC_EMBEDDED_SIWX: ${{ vars.NEXT_PUBLIC_EMBEDDED_SIWX }}
          NEXT_PUBLIC_RPC_URL: ${{ vars.RPC_URL }}
          NEXT_PUBLIC_ESCROW_IMPLEMENTATION_ADDRESS: ${{ vars.ESCROW_IMPLEMENTATION_ADDRESS }}
          NEXT_PUBLIC_ESCROW_FACTORY_ADDRESS: ${{ vars.CONTRACT_FACTORY_ADDRESS }}
        run: |
          set -euo pipefail
          scripts/build-static-export.sh
          scripts/static-site-image.sh push

      # Deploy step

  # The server image goes to the box through the standard deploy: conduit-ucpi/deploy, pinned by
  # commit. The box runs only its stabledrop-deploy script for this key, and only this
  # environment's own build (test-<sha> / cherry-<sha>, its .conf's TAG_PREFIX). Secrets reach the
  # container through an env file on stdin, never a command line or a file left on either machine.
  # NAME= is passed empty when unset, exactly as the old `-e NAME=${{ ... }}` did.
  deploy:
    needs: build
    uses: conduit-ucpi/deploy/.github/workflows/deploy.yml@7ee40498cd11df9224943df43c3459bf47cd7747
    permissions:
      contents: read
      packages: read
    # Required: without it a called workflow sees none of the environment's secrets.
    secrets: inherit
    with:
      environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || startsWith(github.ref, 'refs/tags/cherry') && 'cherry' || 'test' }}
      image: ${{ needs.build.outputs.image }}
      env-vars: |
        NODE_OPTIONS=--max-old-space-size=192
        CHAIN_ID
        RPC_URL
        CHAIN_SERVICE_URL
        USER_SERVICE_URL
        CONTRACT_SERVICE_URL
        AP2_SERVICE_URL
        DISPUTE_SERVICE_URL
        SANCTION_SERVICE_URL
        WHITELABEL_SERVICE_URL
        EMAIL_SERVICE_URL
        RECORDINGS_S3_BUCKET
        RECORDINGS_S3_ENDPOINT
        RECORDINGS_S3_REGION
        GIT_TAG=${{ needs.build.outputs.git_tag }}
        GIT_SHA=${{ needs.build.outputs.git_sha }}
        COOKIE_DOMAIN
        BUILD_VERSION=
        SUPPORTED_TOKENS
        USDC_CONTRACT_ADDRESS=
        USDT_CONTRACT_ADDRESS=
        DEFAULT_TOKEN_SYMBOL=
        MIN_GAS_WEI
        MAX_GAS_PRICE_GWEI
        MAX_GAS_COST_GWEI
        USDC_GRANT_FOUNDRY_GAS
        RESOLUTION_VOTE_FOUNDRY_GAS
        RAISE_DISPUTE_FOUNDRY_GAS
        CLAIM_FUNDS_FOUNDRY_GAS
        GAS_PRICE_BUFFER
        NEXT_PUBLIC_BASE_PATH
        EXPLORER_BASE_URL
        PRODUCT_NAME
        SERVICE_LINK
        NEYNAR_API_URL
        PRIVY_APP_ID
        SHOW_LEGACY_AUTH=
        ALLOWED_FRAME_ANCESTORS
        PROJECTS_LIVE=
        EMAIL_VERIFICATION_LIVE
        SHOPIFY_NAME
        SHOPIFY_SCOPES
        NEXT_PUBLIC_APP_URL
        NEXT_PUBLIC_REDDIT_PIXEL_ID=
        NEXT_PUBLIC_EXCHANGE_RATE_API_URL=
        COINBASE_PROJECT_ID
      env-secrets: |
        MOONPAY_API_KEY=
        X_API_KEY
        TO_EMAILSERVICE_API_KEY
        RECORDINGS_S3_ACCESS_KEY_ID
        RECORDINGS_S3_SECRET_ACCESS_KEY
        TO_USERSERVICE_API_KEY
        NEYNAR_API_KEY=
        WALLETCONNECT_PROJECT_ID
        SHOPIFY_CLIENT_ID=
        SHOPIFY_CLIENT_SECRET=
        SESSION_SECRET=
        MONGODB_URI=
        COINBASE_API_KEY_ID
        COINBASE_API_KEY_SECRET

  # ---------------------------------------------------------------------------
  # Cloudflare Pages deploy — the client release, on its own tag. Publishes the
  # static export to stabledrop.me. (It started life as a GitHub Pages deploy,
  # STATIC_FRONTEND_MIGRATION_PLAN.md Phase 2 step 8; that host is retired.)
  #
  # It BUILDS NOTHING. It publishes the static site the cherry release of the same commit
  # built and stored (ghcr.io/<repo>-static:cherry-<sha>), so what reaches stabledrop.me is
  # exactly what was built with cherry's settings. No cherry release on the commit, no image:
  # the run fails and says so.
  #
  # No `needs:` on build or deploy, and none is possible: the two jobs no longer
  # share a trigger, so on any given run exactly one of them is live. Ordering
  # between a client and an API release is now the tagger's, not the workflow's —
  # see the `if:` below.
  #
  # The `github-pages` environment is what gates this on manual approval — add a
  # required reviewer to it in Settings > Environments. Required reviewers work
  # here because this repo is public; they are unavailable on private repos under
  # the Team plan.
  # ---------------------------------------------------------------------------
  deploy-cloudflare:
    # cloudflareRelease-v* only (plus manual runs). The client and the box are now
    # separate releases: cloudflareRelease-v* publishes to Cloudflare and touches no box,
    # cherry-v* deploys webapp-prod and publishes nothing.
    #
    # The client deliberately does NOT ride cherry-v* any more. What it must not ride
    # is test*, which deploys webapp-test: publishing the client
    # on those would push it ahead of the webapp-prod API that api.stabledrop.me
    # actually proxies. That is the drift the Client/API version rows expose, and
    # a dedicated client tag cannot cause it — this job simply never runs on a
    # box tag.
    #
    # The discipline this hands back to the release, since one tag no longer
    # moves both: a change spanning client and API is TWO tags, API first.
    # Tag cherry-v* and let webapp-prod come up serving the new endpoint, then
    # tag cloudflareRelease-v* to publish the client that calls it. Reversing the
    # order puts a bundle on Cloudflare calling something that 404s until the box
    # deploy lands. A client-only change (copy, styling, a fix inside the
    # bundle) is just the one cloudflareRelease-v* tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/cloudflareRelease-')
    runs-on: ubuntu-latest
    environment:
      # Named for the old host. Every NEXT_PUBLIC_* var and the Cloudflare secrets below
      # resolve against THIS environment, and its approval gate is what guards a release,
      # so the name stays. Renaming means moving all of them.
      name: github-pages
      url: https://stabledrop.me
    permissions:
      contents: read
      # Reads the static site the cherry release stored. Never writes one.
      packages: read
    # One deployment at a time; never cancel a run that is mid-publish.
    concurrency:
      group: deploy-cloudflare
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── The static site the cherry release built for this commit ─────────────────────
      - name: Name this commit's static site
        run: |
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          # Cherry's, always: this job publishes production's client and nothing else.
          echo "IMAGE_TAG=cherry-${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch the static site cherry built
        run: |
          if ! scripts/static-site-image.sh exists; then
            echo "No static site is stored for this commit (ghcr.io/${REPO_LOWER}-static:${IMAGE_TAG}). Tag cherry-v* on ${GITHUB_SHA::8} first; the Cloudflare release only publishes what cherry built." >&2
            exit 1
          fi
          scripts/static-site-image.sh pull

      # ── Cloudflare Pages: the live site ──────────────────────────────────────────────
      #
      # The only host. GitHub Pages was retired after Cloudflare took over stabledrop.me.
      # Without the project name the release would build and then publish nowhere while
      # looking finished, so a missing setting fails the run here instead.
      - name: Check the Cloudflare project is configured
        env:
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "${CLOUDFLARE_PAGES_PROJECT}" ]; then
            echo "CLOUDFLARE_PAGES_PROJECT is not set on the github-pages environment; nothing would be published." >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned so a deploy cannot change underneath a release. The action otherwise
          # resolves its own version at run time, which is how the same tag can behave
          # differently a week apart.
          wranglerVersion: '3.90.0'
          # --branch decides production vs preview, and it is NOT the git ref.
          # This job runs on a cloudflareRelease-v* TAG, so letting wrangler infer the
          # branch would publish every release as a preview on a URL nobody
          # visits, leaving the live site on the previous build with the run
          # still green. It must name the project's production branch.
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
