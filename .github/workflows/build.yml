name: Build and Deploy Next.js app
run-name: Deploy ${{ github.event.head_commit.message }}
on:
  push:
    tags:
      - 'v*'
      - 'test*'
      - 'farcaster-test*'
      - 'cherry*'
  # Manual runs deploy ONLY to GitHub Pages: the box job below is skipped for
  # workflow_dispatch. Lets the Pages build be exercised without shipping to
  # production, which a tag push would do (plan Phase 2 step 9).
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Tag pushes only. A manual run is for validating Pages in isolation and
    # must never touch the production box.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || startsWith(github.ref, 'refs/tags/cherry') && 'cherry' || startsWith(github.ref, 'refs/tags/test') && 'test' || startsWith(github.ref, 'refs/tags/farcaster-test') && 'test_on_prod' || 'test' }}
    permissions:
      contents: read
      packages: write

    steps:
      # Common setup steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
     
      - name: Set environment specific variables
        id: env_vars
        run: |
          echo "ENV_TAG=latest" >> $GITHUB_ENV
          echo "SHA_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV
          echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "GIT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> $GITHUB_ENV
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Build step for test and production
      - name: Setup Node.js and build
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build
        env:
          CHAIN_ID: ${{ vars.CHAIN_ID }}
          RPC_URL: ${{ vars.RPC_URL }}
          SUPPORTED_TOKENS: ${{ vars.SUPPORTED_TOKENS }}
          USDC_CONTRACT_ADDRESS: ${{ vars.USDC_CONTRACT_ADDRESS }}
          USDT_CONTRACT_ADDRESS: ${{ vars.USDT_CONTRACT_ADDRESS }}
          DEFAULT_TOKEN_SYMBOL: ${{ vars.DEFAULT_TOKEN_SYMBOL }}
          USER_SERVICE_URL: ${{ vars.USER_SERVICE_URL }}
          CHAIN_SERVICE_URL: ${{ vars.CHAIN_SERVICE_URL }}
          CONTRACT_SERVICE_URL: ${{ vars.CONTRACT_SERVICE_URL }}
          MOONPAY_API_KEY: ${{ secrets.MOONPAY_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          MIN_GAS_WEI: ${{ vars.MIN_GAS_WEI }}
          MAX_GAS_PRICE_GWEI: ${{ vars.MAX_GAS_PRICE_GWEI }}
          MAX_GAS_COST_GWEI: ${{ vars.MAX_GAS_COST_GWEI }}
          USDC_GRANT_FOUNDRY_GAS: ${{ vars.USDC_GRANT_FOUNDRY_GAS }}
          DEPOSIT_FUNDS_FOUNDRY_GAS: ${{ vars.DEPOSIT_FUNDS_FOUNDRY_GAS }}
          RESOLUTION_VOTE_FOUNDRY_GAS: ${{ vars.RESOLUTION_VOTE_FOUNDRY_GAS }}
          RAISE_DISPUTE_FOUNDRY_GAS: ${{ vars.RAISE_DISPUTE_FOUNDRY_GAS }}
          CLAIM_FUNDS_FOUNDRY_GAS: ${{ vars.CLAIM_FUNDS_FOUNDRY_GAS }}
          GAS_PRICE_BUFFER: ${{ vars.GAS_PRICE_BUFFER }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          NEYNAR_API_URL: ${{ vars.NEYNAR_API_URL }}
          WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          GIT_TAG: ${{ env.GIT_TAG }}
          GIT_SHA: ${{ env.GIT_SHA }}
          # Same values again as NEXT_PUBLIC_*, so the bundle can report its own
          # version rather than only the API's. Next inlines NEXT_PUBLIC_* at
          # build time; GIT_TAG/GIT_SHA above stay server-side for /api/config.
          # The trust anchor for escrow verification. MUST be build-time
          # (NEXT_PUBLIC_*, inlined into the bundle) and MUST NOT be served from
          # /api/config: if the same API that supplies a clone address also
          # supplied the implementation to check it against, a compromised API
          # would return a matching pair and the check would compare its own
          # answer to itself. See lib/escrow/verifyEscrowClone.ts.
          NEXT_PUBLIC_ESCROW_IMPLEMENTATION_ADDRESS: ${{ vars.ESCROW_IMPLEMENTATION_ADDRESS }}
          NEXT_PUBLIC_GIT_TAG: ${{ env.GIT_TAG }}
          NEXT_PUBLIC_GIT_SHA: ${{ env.GIT_SHA }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          PRODUCT_NAME: ${{ vars.PRODUCT_NAME }}
          SERVICE_LINK: ${{ vars.SERVICE_LINK }}
          ALLOWED_FRAME_ANCESTORS: ${{ vars.ALLOWED_FRAME_ANCESTORS }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_NAME: ${{ vars.SHOPIFY_NAME }}
          SHOPIFY_SCOPES: ${{ vars.SHOPIFY_SCOPES }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REDDIT_PIXEL_ID: ${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}
          NEXT_PUBLIC_EXCHANGE_RATE_API_URL: ${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}
          # Mobile debug logging. Next inlines NEXT_PUBLIC_* at build time, so
          # this has to be present HERE - setting it on the running container
          # does nothing. Unset resolves to '' which is not 'true', so the
          # pipeline stays off unless a repo/environment variable turns it on.
          NEXT_PUBLIC_MOBILE_DEBUG_LOGGING: ${{ vars.NEXT_PUBLIC_MOBILE_DEBUG_LOGGING }}
          # Set to 'false' to disable SIWX for embedded email/social wallets too.
          NEXT_PUBLIC_EMBEDDED_SIWX: ${{ vars.NEXT_PUBLIC_EMBEDDED_SIWX }}
          COINBASE_PROJECT_ID: ${{ vars.COINBASE_PROJECT_ID }}
          COINBASE_API_KEY_ID: ${{ secrets.COINBASE_API_KEY_ID }}
          COINBASE_API_KEY_SECRET: ${{ secrets.COINBASE_API_KEY_SECRET }}
        run: |
          npm ci --legacy-peer-deps
          
          # Generate Farcaster manifest with correct domain
          echo "=== Generating Farcaster manifest ==="
          mkdir -p public/.well-known
          cat > public/.well-known/farcaster.json << EOF
          {
            "name": "Conduit Escrow",
            "version": "1.0.0",
            "iconUrl": "https://farcaster.conduit-ucpi.com/icon.png",
            "splashImageUrl": "https://farcaster.conduit-ucpi.com/preview.png",
            "homeUrl": "https://farcaster.conduit-ucpi.com"
          }
          EOF
          
          echo "=== Generated manifest content ==="
          cat public/.well-known/farcaster.json
          
          npm run build
          mkdir -p .next/standalone
          # Debug: Check what files exist before copying
          echo "=== Checking build output ==="
          ls -la .next/
          ls -la .next/static/ || echo "No .next/static directory"
          find .next/static -name "*.css" || echo "No CSS files found"
          # Copy static assets required for standalone build
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static || echo "Failed to copy static"
          cp -r public .next/standalone/public || echo "Failed to copy public"
          # Debug: Check what was copied
          echo "=== Checking copied files ==="
          ls -la .next/standalone/.next/static/ || echo "No copied static files"
          find .next/standalone -name "*.css" || echo "No CSS files in standalone"
          echo "=== Checking public files ==="
          ls -la .next/standalone/public/ || echo "No public directory in standalone"
          ls -la .next/standalone/public/payment_gateway.png || echo "payment_gateway.png not found"

      # Docker steps  
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_on: error
          command: |
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file Dockerfile \
              --push \
              --tag ghcr.io/${{ env.REPO_LOWER }}:${{ env.SHA_TAG }} \
              .

      # Deploy step
      - name: Deploy to GCP
        run: |
          set -o pipefail

          # The key is held in an agent, never written to disk. `ssh -i` takes a
          # path and has no way to accept a key as a string, so the choice is a
          # file or an agent — and a file left in ~/.ssh stays readable by every
          # later step in the job, including any third-party action.
          # printf, not echo: ssh-add rejects a key without a trailing newline.
          eval "$(ssh-agent -s)" > /dev/null
          trap 'ssh-agent -k > /dev/null 2>&1 || true' EXIT
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" | ssh-add - 2>/dev/null \
            || { echo "Could not load SSH_PRIVATE_KEY into the agent" >&2; exit 1; }

          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ vars.VM_IP }} >> ~/.ssh/known_hosts

          SSH="ssh -o BatchMode=yes -o ServerAliveInterval=15 -l gituser ${{ vars.VM_IP }}"
          IMAGE="ghcr.io/${{ env.REPO_LOWER }}:${{ env.SHA_TAG }}"

          # Run a command up to N times with linear backoff.
          retry() {
            attempts=$1; shift
            n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                echo "FAILED after $n attempts: $*" >&2
                return 1
              fi
              echo "Attempt $n failed; retrying in $((n * 10))s: $*" >&2
              sleep $((n * 10))
              n=$((n + 1))
            done
          }

          # ---------------------------------------------------------------
          # Ship the image over SSH instead of having the box pull it.
          #
          # The production box's egress IP is intermittently refused by
          # GitHub's edge: measured at 5 failures in 20 TLS handshakes to
          # ghcr.io, while Google, Cloudflare and Docker Hub were 0 in 20 from
          # the same host at the same time. DNS and local networking are clean,
          # so there is nothing to fix on the box — the deploy simply cannot
          # rely on it reaching ghcr.io. The runner's GitHub connectivity is
          # fine and SSH to the box is reliable, so we push the bytes down the
          # connection that works.
          # ---------------------------------------------------------------

          # The image is multi-platform, so save the one the box can actually
          # run rather than whichever the runner happens to be.
          REMOTE_ARCH=$($SSH 'dpkg --print-architecture 2>/dev/null || uname -m')
          case "$REMOTE_ARCH" in
            amd64|x86_64)  PLATFORM=linux/amd64 ;;
            arm64|aarch64) PLATFORM=linux/arm64 ;;
            *) echo "Unsupported remote architecture: $REMOTE_ARCH" >&2; exit 1 ;;
          esac
          echo "Remote architecture: $REMOTE_ARCH -> $PLATFORM"

          # buildx --push uploads straight to the registry without leaving the
          # image in the runner's local store, so fetch it back before saving.
          retry 5 docker pull --platform "$PLATFORM" "$IMAGE"

          ship_image() {
            docker save "$IMAGE" | gzip -1 | $SSH 'gunzip | docker load'
          }

          if $SSH "docker image inspect '$IMAGE' >/dev/null 2>&1"; then
            echo "Box already has $IMAGE; skipping transfer."
          else
            retry 3 ship_image
          fi

          # Prove the image is on the box BEFORE the deploy script stops the
          # running container. Without this a failed transfer would take the
          # site down and leave nothing to start again.
          $SSH "docker image inspect '$IMAGE' >/dev/null" \
            || { echo "Image missing on the box after transfer" >&2; exit 1; }

          # Create deployment script with all values populated
          cat > /tmp/deploy_script.sh << EOF
          set -e
          docker stop ${{ vars.SERVICE_NAME }} || true
          docker rm ${{ vars.SERVICE_NAME }} || true
          docker run -d \\
            --name ${{ vars.SERVICE_NAME }} \\
            --network ${{ vars.DOCKER_NETWORK }} \\
            --restart unless-stopped \\
            --memory=256m \\
            -e NODE_OPTIONS="--max-old-space-size=192" \\
            -e CHAIN_ID="${{ vars.CHAIN_ID }}" \\
            -e RPC_URL="${{ vars.RPC_URL }}" \\
            -e CHAIN_SERVICE_URL="${{ vars.CHAIN_SERVICE_URL }}" \\
            -e USER_SERVICE_URL="${{ vars.USER_SERVICE_URL }}" \\
            -e CONTRACT_SERVICE_URL="${{ vars.CONTRACT_SERVICE_URL }}" \\
            -e MOONPAY_API_KEY="${{ secrets.MOONPAY_API_KEY }}" \\
            -e X_API_KEY="${{ secrets.X_API_KEY }}" \\
            -e GIT_TAG="${{ env.GIT_TAG }}" \\
            -e GIT_SHA="${{ env.GIT_SHA }}" \\
            -e COOKIE_DOMAIN="${{ vars.COOKIE_DOMAIN }}" \\
            -e BUILD_VERSION="${{ env.BUILD_VERSION }}" \\
            -e SUPPORTED_TOKENS='${{ vars.SUPPORTED_TOKENS }}' \\
            -e USDC_CONTRACT_ADDRESS="${{ vars.USDC_CONTRACT_ADDRESS }}" \\
            -e USDT_CONTRACT_ADDRESS="${{ vars.USDT_CONTRACT_ADDRESS }}" \\
            -e DEFAULT_TOKEN_SYMBOL="${{ vars.DEFAULT_TOKEN_SYMBOL }}" \\
            -e MIN_GAS_WEI="${{ vars.MIN_GAS_WEI }}" \\
            -e MAX_GAS_PRICE_GWEI="${{ vars.MAX_GAS_PRICE_GWEI }}" \\
            -e MAX_GAS_COST_GWEI="${{ vars.MAX_GAS_COST_GWEI }}" \\
            -e USDC_GRANT_FOUNDRY_GAS="${{ vars.USDC_GRANT_FOUNDRY_GAS }}" \\
            -e DEPOSIT_FUNDS_FOUNDRY_GAS="${{ vars.DEPOSIT_FUNDS_FOUNDRY_GAS }}" \\
            -e RESOLUTION_VOTE_FOUNDRY_GAS="${{ vars.RESOLUTION_VOTE_FOUNDRY_GAS }}" \\
            -e RAISE_DISPUTE_FOUNDRY_GAS="${{ vars.RAISE_DISPUTE_FOUNDRY_GAS }}" \\
            -e CLAIM_FUNDS_FOUNDRY_GAS="${{ vars.CLAIM_FUNDS_FOUNDRY_GAS }}" \\
            -e GAS_PRICE_BUFFER="${{ vars.GAS_PRICE_BUFFER }}" \\
            -e NEXT_PUBLIC_BASE_PATH="${{ vars.NEXT_PUBLIC_BASE_PATH }}" \\
            -e EXPLORER_BASE_URL="${{ vars.EXPLORER_BASE_URL }}" \\
            -e PRODUCT_NAME="${{ vars.PRODUCT_NAME }}" \\
            -e SERVICE_LINK="${{ vars.SERVICE_LINK }}" \\
            -e NEYNAR_API_KEY="${{ secrets.NEYNAR_API_KEY }}" \\
            -e NEYNAR_API_URL="${{ vars.NEYNAR_API_URL }}" \\
            -e WALLETCONNECT_PROJECT_ID="${{ secrets.WALLETCONNECT_PROJECT_ID }}" \\
            -e ALLOWED_FRAME_ANCESTORS="${{ vars.ALLOWED_FRAME_ANCESTORS }}" \\
            -e PROJECTS_LIVE="${{ vars.PROJECTS_LIVE }}" \\
            -e EMAIL_VERIFICATION_LIVE="${{ vars.EMAIL_VERIFICATION_LIVE }}" \\
            -e SHOPIFY_CLIENT_ID="${{ secrets.SHOPIFY_CLIENT_ID }}" \\
            -e SHOPIFY_CLIENT_SECRET="${{ secrets.SHOPIFY_CLIENT_SECRET }}" \\
            -e SHOPIFY_NAME="${{ vars.SHOPIFY_NAME }}" \\
            -e SHOPIFY_SCOPES="${{ vars.SHOPIFY_SCOPES }}" \\
            -e SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \\
            -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \\
            -e NEXT_PUBLIC_APP_URL="${{ vars.NEXT_PUBLIC_APP_URL }}" \\
            -e NEXT_PUBLIC_REDDIT_PIXEL_ID="${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}" \\
            -e NEXT_PUBLIC_EXCHANGE_RATE_API_URL="${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}" \\
            -e COINBASE_PROJECT_ID="${{ vars.COINBASE_PROJECT_ID }}" \\
            -e COINBASE_API_KEY_ID="${{ secrets.COINBASE_API_KEY_ID }}" \\
            -e COINBASE_API_KEY_SECRET="${{ secrets.COINBASE_API_KEY_SECRET }}" \\
            ghcr.io/${{ env.REPO_LOWER }}:${{ env.SHA_TAG }}
          # Loaded images accumulate now that nothing is pulling and pruning
          # implicitly; drop only untagged layers, never a tagged image.
          docker image prune -f
          EOF

          # Copy script to remote tmpfs and execute
          retry 3 scp -o BatchMode=yes /tmp/deploy_script.sh gituser@${{ vars.VM_IP }}:/dev/shm/deploy_script.sh
          $SSH "chmod +x /dev/shm/deploy_script.sh && /dev/shm/deploy_script.sh && rm /dev/shm/deploy_script.sh"

  # ---------------------------------------------------------------------------
  # GitHub Pages deploy — runs ALONGSIDE the box deploy above, not instead of it
  # (STATIC_FRONTEND_MIGRATION_PLAN.md, Phase 2 step 8). Publishes the static
  # export to the repo's Pages URL while stabledrop.me keeps being served from
  # the box, so the two can be compared before any DNS change.
  #
  # Deliberately has no `needs:` on build-and-deploy: the two paths are
  # independent, and a box deploy failure should not hide a Pages regression or
  # vice versa.
  #
  # The `github-pages` environment is what gates this on manual approval — add a
  # required reviewer to it in Settings > Environments. Required reviewers work
  # here because this repo is public; they are unavailable on private repos under
  # the Team plan.
  # ---------------------------------------------------------------------------
  deploy-github-pages:
    # cherry tags only (plus manual runs).
    #
    # api.stabledrop.me proxies webapp-prod, and cherry-v* is the tag that
    # deploys webapp-prod — so shipping Pages on the same trigger keeps the
    # static frontend and the API it talks to on the same commit. Deploying
    # Pages on test*/farcaster-test* would push the client ahead of an API that
    # those tags do not touch (they deploy webapp-test), which is exactly the
    # drift the Client/API version rows were added to expose.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/cherry')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    # One Pages deployment at a time; never cancel a run that is mid-publish.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build static export
        env:
          # STATIC_EXPORT flips next.config.js to `output: 'export'`. Without it
          # this would build the standalone server bundle and there would be
          # nothing in out/ to publish.
          STATIC_EXPORT: 'true'

          # The static bundle has no API of its own — every apiFetch() call is
          # rewritten against this. Must point at the box (see the
          # api.stabledrop.me block in the caddy repo). If unset the calls fall
          # back to relative paths and 404 against Pages.
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}

          # '/webapp' while validating on the default <org>.github.io/webapp URL;
          # empty once a custom domain serves the site from its root.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}

          # Only NEXT_PUBLIC_* vars are passed. Everything server-side stays out
          # of this build on purpose: its output is published as world-readable
          # static files, and Next inlines NEXT_PUBLIC_* into the client bundle.
          # (Safe today because every getStaticProps here returns `props: {}`, so
          # no build-time data reaches the HTML — keep it that way.)
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_REDDIT_PIXEL_ID: ${{ vars.NEXT_PUBLIC_REDDIT_PIXEL_ID }}
          NEXT_PUBLIC_EXCHANGE_RATE_API_URL: ${{ vars.NEXT_PUBLIC_EXCHANGE_RATE_API_URL }}
          NEXT_PUBLIC_MOBILE_DEBUG_LOGGING: ${{ vars.NEXT_PUBLIC_MOBILE_DEBUG_LOGGING }}
          NEXT_PUBLIC_EMBEDDED_SIWX: ${{ vars.NEXT_PUBLIC_EMBEDDED_SIWX }}
          # The trust anchor for escrow verification. MUST be build-time
          # (NEXT_PUBLIC_*, inlined into the bundle) and MUST NOT be served from
          # /api/config: if the same API that supplies a clone address also
          # supplied the implementation to check it against, a compromised API
          # would return a matching pair and the check would compare its own
          # answer to itself. See lib/escrow/verifyEscrowClone.ts.
          NEXT_PUBLIC_ESCROW_IMPLEMENTATION_ADDRESS: ${{ vars.ESCROW_IMPLEMENTATION_ADDRESS }}
        run: |
          set -euo pipefail

          # Stamp this bundle with its own version. The API reports its own
          # separately via /api/config, and the two are different deployments —
          # showing only the API's is what made a current Pages build look weeks
          # stale in the UI.
          export NEXT_PUBLIC_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          export NEXT_PUBLIC_GIT_SHA="$(git rev-parse --short HEAD)"
          echo "Building client version: ${NEXT_PUBLIC_GIT_TAG:-<no tag>} ${NEXT_PUBLIC_GIT_SHA}"

          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL is not set — the published site would" >&2
            echo "issue relative /api/* calls against Pages and every one would 404." >&2
            exit 1
          fi

          npm ci --legacy-peer-deps
          npm run build:static

          # Client-side routing fallback. Pages serves 404.html for any path it
          # has no file for; making it the app shell lets the router resolve
          # dynamic routes such as /projects/<groupId>, which the export can only
          # emit as a literal "[groupId]" directory.
          cp out/index.html out/404.html

          # Tells Pages to serve _next/* verbatim rather than running the paths
          # through Jekyll, which ignores underscore-prefixed directories.
          touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
